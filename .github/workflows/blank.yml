name: Build Mohamed & Lolo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Android platform
        run: |
          flutter create . \
            --platforms=android \
            --org=com.mohamedlolo \
            --project-name=mohamed_lolo_game

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/Mohamed-Lolo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Lolo-APK
          path: release/Mohamed-Lolo.apk
          if-no-files-found: error
          retention-days: 30
